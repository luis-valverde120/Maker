frameworks:
  express:
    language: ts
    init_cmd: ["npm", "init", "-y"]
    scripts_file: "package.json"
    scripts_section: "scripts"
    scripts:
      dev: "nodemon"
      build: "tsc"
      start: "node dist/index.js"
    install_cmd: ["npm", "install"]
    install_dev_cmd: ["npm", "install", "-D"]
    dependencies: ["express", "cors", "dotenv", "morgan", "helmet", "cookie-parser"]
    dev_dependencies: ["typescript", "ts-node", "@types/node", "@types/express", "nodemon", "@types/cors", "@types/morgan", "@types/cookie-parser"]
    architectures:
      mvc:
        folders:
          - src/controllers
          - src/models
          - src/routes
          - src/views
          - src/middlewares
          - .vscode
        files:
          "src/index.ts": "maker-templates/express/mvc/index.ts"
          ".env": "maker-templates/shared/.env"
          ".vscode/settings.json": "maker-templates/shared/.vscode/settings.json"
          "nodemon.json": "maker-templates/express/mvc/nodemon.json"
          "tsconfig.json": "maker-templates/express/mvc/tsconfig.json"
          "src/routes/index.ts": "maker-templates/express/mvc/routes/index.routes.ts"
          "src/controllers/index.controller.ts": "maker-templates/express/mvc/controllers/index.controller.ts"
          "src/middlewares/index.middleware.ts": "maker-templates/express/mvc/middlewares/index.middleware.ts"

  fastapi:
    language: python
    init_cmd: ["uv", "init"]
    install_cmd: ["uv", "add"]
    install_dev_cmd: ["uv", "add", "--dev"]
    dependencies: ["fastapi", "uvicorn"]
    dev_dependencies: ["pytest", "ruff"]
    architectures:
      mvc:
        folders:
          - app/controllers
          - app/models
          - app/routes
          - app/templates
          - test
          - .vscode
        files:
          "app/main.py": "maker-templates/fastapi/index.js"
          ".env": "maker-templates/shared/.env"
          ".vscode/settings.json": "maker-templates/shared/.vscode/settings.json"
